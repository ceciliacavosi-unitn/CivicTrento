name: civiccoins
description: A new Flutter project.
publish_to: 'none' # per evitare pubblicazione accidentale su pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0 
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  intl: ^0.18.1
  #health: ^8.0.0
  permission_handler: ^11.3.0
  http: ^1.2.0



dev_dependencies:
  flutter_test:
      sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1 


flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/logo.png"



flutter:
  uses-material-design: true

  assets:
    - assets/images/
